[package]
name = "otp-forwarder-desktop"
version = "0.1.0"
description = "Forward SMS OTPs from Android and auto-type them on Windows"
authors = ["cslavenc"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "otp_forwarder_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
# Wipe AES/GHASH key schedules on drop (merged into aes-gcm's copies).
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
base64 = "0.23"
getrandom = "0.4"
keyring = { version = "3", features = ["windows-native"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
thiserror = "2"
url = "2"
zeroize = "1"
reqwest = "0.13"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
arboard = { version = "3.7", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[[example]]
name = "otpfwd-send"
test = true
